<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discordia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c7cff'/%3E%3Cpath d='M10 8h5.5a8 8 0 0 1 0 16H10z' stroke='white' stroke-width='3.2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;800&family=Chakra+Petch:wght@400;500;600;700&family=Shippori+Mincho:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Comic+Neue:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bgLayer" aria-hidden="true"></div>

<!-- Login -->
<section id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark" aria-hidden="true"></span><span>Discordia</span></div>
    <h1 id="authTitle">Bem-vindo de volta</h1>
    <p class="muted" id="authSub">Entre para falar com seus amigos.</p>
    <form id="authForm" novalidate>
      <label>Nome de usuário<input id="aUser" autocomplete="username" placeholder="ex.: lucas" maxlength="20"></label>
      <label id="aNameWrap" hidden>Nome de exibição<input id="aName" maxlength="32" placeholder="Como os amigos vão te ver"></label>
      <label>Senha<input id="aPass" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres"></label>
      <p class="form-err" id="authErr" aria-live="polite"></p>
      <button class="btn primary big" type="submit" id="authBtn">Entrar</button>
    </form>
    <p class="muted small">
      <span id="authSwitchTxt">Ainda não tem conta?</span>
      <button class="link" type="button" id="authSwitch">Criar conta</button>
    </p>
  </div>
</section>

<!-- App -->
<div id="app" hidden>
  <nav id="rail" aria-label="Grupos"></nav>
  <aside id="side">
    <div id="sideBody"></div>
    <div id="voiceBar" hidden></div>
    <div id="userBar"></div>
  </aside>
  <main id="main"></main>
  <aside id="members" hidden></aside>
  <div id="scrim" hidden></div>
</div>

<div id="audioSink" hidden></div>
<div id="modalRoot"></div>
<div id="popRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script src="socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
