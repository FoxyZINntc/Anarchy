<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anarchy</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&family=Nunito:wght@400;600;800&family=Chakra+Petch:wght@400;500;600;700&family=Shippori+Mincho:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Comic+Neue:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="v2.css">
<link rel="stylesheet" href="plates.css">
<link rel="stylesheet" href="avfx.css">
<link rel="stylesheet" href="recorte.css">
<link rel="stylesheet" href="rpg.css">
<link rel="stylesheet" href="diversao.css">
<link rel="stylesheet" href="jogos.css">
<link rel="stylesheet" href="caixas.css">
<link rel="stylesheet" href="cartas.css">
</head>
<body>
<div id="bgLayer" aria-hidden="true"></div>

<!-- Login -->
<section id="auth" hidden>
  <div class="au-bg" aria-hidden="true">
    <i class="au-glow g1"></i><i class="au-glow g2"></i><i class="au-glow g3"></i>
    <span class="au-float" style="--c:#3ee0c5;--x:46%;--y:7%;--r:-3deg;--d:0s">kkkkkkkkkk</span>
    <span class="au-float" style="--c:#6c7cff;--x:6%;--y:72%;--r:-6deg;--d:-2s">alguém on?</span>
    <span class="au-float" style="--c:#ff6b8b;--x:23%;--y:88%;--r:4deg;--d:-4s">bora call??</span>
    <span class="au-float" style="--c:#b07cff;--x:39%;--y:92%;--r:3deg;--d:-1s">tá quieto demais aqui...</span>
    <span class="au-float" style="--c:#f5b83d;--x:90%;--y:33%;--r:5deg;--d:-3s">quem pegou<br>meu lanche</span>
    <span class="au-float" style="--c:#6c7cff;--x:75%;--y:93%;--r:-4deg;--d:-5s">só mais uma partida</span>
  </div>
  <div class="au-wrap">
    <div class="au-hero">
      <div class="au-brand"><span class="logo-mark" aria-hidden="true"></span><span>Anarchy</span></div>
      <h1>A nova era<br>dos reprimidos.</h1>
      <p>Sem formulário chato. Só conversa com o Porteiro e ele te deixa entrar.</p>
      <span class="au-pill"><i></i>chat, calls e tela compartilhada</span>
    </div>
    <div class="au-stage">
      <button type="button" class="porteiro big" id="ptBig" aria-label="Porteiro (clique nele)"></button>
      <span class="pt-speech" id="ptSpeech" aria-live="polite"></span>
      <div class="au-card">
        <header class="au-head">
          <div class="porteiro mini" aria-hidden="true"></div>
          <div class="au-who"><b>Porteiro</b><span><i class="au-dot"></i><span id="ptStatus">online</span></span></div>
          <button type="button" class="au-switch" id="authSwitch">Criar conta</button>
        </header>
        <div class="au-log" id="authLog" role="log" aria-live="polite" aria-label="Conversa com o Porteiro"></div>
        <form id="authForm" class="au-input" novalidate autocomplete="on">
          <label for="authInput" class="au-sr" id="authLabel">Nome de usuário</label>
          <input id="authInput" autocomplete="username" maxlength="32" spellcheck="false" autocapitalize="off">
          <button type="button" class="au-peek" id="authPeek" hidden aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="au-send" type="submit" id="authBtn" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- barra de atualização -->
<div id="updBar" role="status" hidden></div>

<!-- App -->
<div id="app" hidden>
  <nav id="rail" aria-label="Grupos"></nav>
  <aside id="side">
    <div id="sideBody"></div>
    <div id="voiceBar" hidden></div>
    <div id="userBar"></div>
  </aside>
  <main id="main"></main>
  <aside id="members" hidden></aside>
  <div id="scrim" hidden></div>
</div>

<div id="audioSink" hidden></div>
<div id="modalRoot"></div>
<div id="popRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script src="socket.io.min.js"></script>
<script src="fx.js"></script>
<script src="caixas.js"></script>
<script src="jogos.js"></script>
<script src="cartas.js"></script>
<script src="diversao.js"></script>
<script src="rpg-core.js"></script>
<script src="rpg-draw.js"></script>
<script src="rpg.js"></script>
<script src="vendor/gifenc.js"></script>
<script src="recorte.js"></script>
<script src="app.js"></script>
</body>
</html>
